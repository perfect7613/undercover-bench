[project]
name = "undercover-bench"
version = "0.1.0"
description = "Auditable game controllers and research instrumentation"
requires-python = ">=3.12"
dependencies = [
    "modal==1.5.0",
 "huggingface-hub>=0.34,<2",
 "pydantic>=2,<3",
]

[project.optional-dependencies]
rlcr = [
    "accelerate==1.15.0",
    "peft==0.21.2",
    "safetensors>=0.4",
    "torch==2.14.1",
    "transformers==5.20.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["undercover_bench"]
