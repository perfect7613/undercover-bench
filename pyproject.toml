[project]
name = "undercover-bench"
version = "0.1.0"
description = "Auditable game controllers and research instrumentation"
requires-python = ">=3.12"
dependencies = ["modal==1.5.0", "huggingface-hub>=0.34,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["undercover_bench"]
